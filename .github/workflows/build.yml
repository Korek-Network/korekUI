name: Build KOREK Miner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node --check src/main.js
      - run: node --check src/cpu-worker.js
      - run: node --check src/renderer/app.js
      - run: node --check src/renderer/gpu.js

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: windows-latest, command: "npm run dist:windows" }
          - { os: ubuntu-latest, command: "npm run dist:linux" }
          - { os: macos-latest, command: "npm run dist:mac" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: miner-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: korekui-testnet-latest
          name: KOREK Miner Planck Testnet v0.3.5
          prerelease: true
          make_latest: false
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.zip
